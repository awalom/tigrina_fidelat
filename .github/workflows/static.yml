name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          mkdir _site
          cp -R index.html app.js styles.css sounds.json admin src audio extra-letters writing-excercises _site/
          mkdir _site/assets
          cp -R assets/fonts _site/assets/
      - name: Generate login config
        env:
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -n "$SITE_USERNAME" ] && [ -n "$SITE_PASSWORD" ]; then
            node tools/generate-auth-config.mjs _site/auth-config.json
          else
            echo "::warning::SITE_USERNAME and SITE_PASSWORD are not configured; deploying without a login."
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
