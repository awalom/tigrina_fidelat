# Deploys the static site to Hostinger (erimlsb.ch) over FTP
name: Deploy to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "hostinger-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp -R index.html app.js styles.css sounds.json admin src audio extra-letters writing-excercises _site/
          mkdir _site/assets
          cp -R assets/fonts _site/assets/
      - name: Generate login config
        env:
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -n "$SITE_USERNAME" ] && [ -n "$SITE_PASSWORD" ]; then
            node tools/generate-auth-config.mjs _site/auth-config.json
          else
            echo "::warning::SITE_USERNAME and SITE_PASSWORD are not configured; deploying without a login."
          fi
      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
